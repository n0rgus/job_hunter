[pytest]
minversion = 7.0
# Look for tests only inside the 'test' folder at the repo root
testpaths =
    test

# Test file discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Pytest options:
#  -ra : show extra summary for (xfailed, xpassed, skipped, failed)
addopts = -ra

# Live logging (optional)
log_cli = true
log_cli_level = INFO

# Common deprecation noise filters (optional)
filterwarnings =
    ignore::DeprecationWarning
